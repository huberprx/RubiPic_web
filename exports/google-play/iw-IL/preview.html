<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RubiPic — Google Play iw-IL preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; background: #1a1a1a; color: #f5f5f5; }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  p.lead { margin: 0 0 24px; color: #bbb; max-width: 70ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  figure { margin: 0; background: #2a2a2a; border-radius: 12px; overflow: hidden; border: 1px solid #444; }
  figure.feature { grid-column: 1 / -1; max-width: 1024px; }
  figure img { display: block; width: 100%; height: auto; background: #111; }
  figcaption { padding: 12px 14px; font-size: 0.82rem; line-height: 1.45; color: #ccc; }
  figcaption strong { color: #fff; word-break: break-all; }
  a { color: #9cf; }
</style>
</head>
<body>
  <h1>RubiPic — Google Play listing (עברית / iw-IL)</h1>
  <p class="lead">Review export for Hubert. Not uploaded to Play Console. Cards match <code>googleplay.html</code> including phone frames. <a href="../index.html">All locales</a></p>
  <div class="grid">
    <figure class="feature">
      <img src="feature-graphic.png" width="1024" height="500" alt="Feature graphic">
      <figcaption><strong>feature-graphic.png</strong><br>Feature graphic · 1024×500 px</figcaption>
    </figure>
    <figure>
      <img src="01-start-with-any-photo.png" width="1080" height="1920" alt="Phone screenshot 1">
      <figcaption><strong>01-start-with-any-photo.png</strong><br>Phone screenshot 1 · 1080×1920 px</figcaption>
    </figure>
    <figure>
      <img src="02-adjust-cube-colors.png" width="1080" height="1920" alt="Phone screenshot 2">
      <figcaption><strong>02-adjust-cube-colors.png</strong><br>Phone screenshot 2 · 1080×1920 px</figcaption>
    </figure>
    <figure>
      <img src="03-adjust-image-settings.png" width="1080" height="1920" alt="Phone screenshot 3">
      <figcaption><strong>03-adjust-image-settings.png</strong><br>Phone screenshot 3 · 1080×1920 px</figcaption>
    </figure>
    <figure>
      <img src="04-download-assembly-instructions.png" width="1080" height="1920" alt="Phone screenshot 4">
      <figcaption><strong>04-download-assembly-instructions.png</strong><br>Phone screenshot 4 · 1080×1920 px</figcaption>
    </figure>
    <figure>
      <img src="05-print-color.png" width="1080" height="1920" alt="Phone screenshot 5">
      <figcaption><strong>05-print-color.png</strong><br>Phone screenshot 5 · 1080×1920 px</figcaption>
    </figure>
    <figure>
      <img src="06-print-bw.png" width="1080" height="1920" alt="Phone screenshot 6">
      <figcaption><strong>06-print-bw.png</strong><br>Phone screenshot 6 · 1080×1920 px</figcaption>
    </figure>
    <figure>
      <img src="07-in-your-language.png" width="1080" height="1920" alt="Phone screenshot 7">
      <figcaption><strong>07-in-your-language.png</strong><br>Phone screenshot 7 · 1080×1920 px</figcaption>
    </figure>
  </div>
</body>
</html>
